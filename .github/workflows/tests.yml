name: Tests

# Ejecuta en cada PR y push a main los tests de la logica pura de src/ y la
# comprobacion del pipeline de datos (scripts/datos.mjs): el catalogo real
# debe validar y data/catalogo_data.js debe estar sincronizado. Es el mismo
# Node que se usa en local con `npm test` y `npm run datos:check`; jugar no
# depende de Node en runtime.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar los tests
        run: npm test

      - name: Validar el contenido y comprobar los datos sincronizados
        run: npm run datos:check